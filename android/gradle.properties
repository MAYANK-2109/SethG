# Project-wide Gradle settings.

# AndroidX support
android.useAndroidX=true

# Suppress compileSdk=35 warning with AGP 8.5.2
android.suppressUnsupportedCompileSdk=35

# Enable R8 full mode for smaller APK (release builds)
android.enableR8.fullMode=false

# Kotlin code style
kotlin.code.style=official

# Gradle daemon memory — safe for most machines
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel builds
org.gradle.parallel=true

# Build caching
org.gradle.caching=true

# Configuration cache (speeds up incremental builds)
org.gradle.configuration-cache=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Use JDK 21
org.gradle.java.home=C:/Users/nikhi/.jdks/jbr-21.0.11

